# ###################################################################
# INFRASTRUCTURE DESTRUCTION (UNCOMMENT THIS SECTION WHEN DESTROYING)
# ###################################################################
name: Deploy lumifi backend Infrastructure to production environment

on:
  push:
    branches:
      - production-test
      
permissions:
  contents: read
  id-token: write

jobs:
  destroy-serverless:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: prod
      AWS_REGION: us-east-1
      API_ROOT_PATH: api/v1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS Credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          # echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Serverless Framework
        run: npm install -g serverless@4.0.0

      - name: Download DB outputs
        uses: actions/download-artifact@v4
        with:
          name: db-env-vars
          path: ./

      - name: Load DB variables
        run: |
          # Load variables from file
          source ./db_outputs.env
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
          echo "LAMBDA_SG_ID=$LAMBDA_SG_ID" >> $GITHUB_ENV
          echo "SUBNET_IDS=$SUBNET_IDS" >> $GITHUB_ENV

      - name: Retrieve Secrets from AWS Secrets Manager
        id: get-secrets
        run: |
          SECRET_NAME="$ENVIRONMENT-lumifitest-rds-credentials-be-pvt"
          echo "Retrieving secrets from: $SECRET_NAME"
          SECRET_ARN=$(aws secretsmanager describe-secret --secret-id $SECRET_NAME --query ARN --output text)
          echo "Secret ARN: $SECRET_ARN"

          # Retrieve secret value
          SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id $SECRET_NAME --query SecretString --output text)
          echo "Raw secret value retrieved"
          echo "$SECRET_VALUE" > secret.json

          # Parse values
          DB_NAME=$(jq -r '.db_name' secret.json)
          DB_USER=$(jq -r '.db_user' secret.json)
          DB_PASSWORD=$(jq -r '.db_password' secret.json)

          # Log non-sensitive values
          echo "DB_NAME: $DB_NAME"
          echo "DB_USER: $DB_USER"
          echo "DB_PORT: $DB_PORT"

          # Set environment variables
          echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV
          echo "DB_USER=$DB_USER" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
          echo "JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          echo "PG_ENCRYPT_SECRET=$PG_ENCRYPT_SECRET" >> $GITHUB_ENV

      - name: Create prod.env.yml
        run: |
          # Convert comma-separated SUBNET_IDS to YAML array format
          SUBNET_IDS_YAML=$(echo "$SUBNET_IDS" | tr ',' '\n' | sed 's/^/      - /')
          # String version (comma-separated, for env vars)
          SUBNET_IDS_STRING=$(echo "$SUBNET_IDS_YAML" | sed 's/^[[:space:]]*-\s*//' | tr '\n' ',' | sed 's/,$//')
          cat <<EOF > prod.env.yml
          DB_HOST: ${{ env.DB_HOST }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_PORT: ${{ env.DB_PORT }}
          
          SLS_AWS_ACCESS_KEY_ID: ${{ secrets.SLS_AWS_ACCESS_KEY_ID }}
          SLS_AWS_SECRET_ACCESS_KEY: ${{ secrets.SLS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${AWS_REGION}
          
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PG_ENCRYPT_SECRET: ${{ secrets.PG_ENCRYPT_SECRET }}
          AWS_SES_SENDER_EMAIL: ${{ secrets.AWS_SES_SENDER_EMAIL }}
          FE_APP_URL: ${{ secrets.PROD_FE_APP_URL }}
          API_ROOT_PATH: ${API_ROOT_PATH}
          
          STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          IMPLANT_REGISTRATION_PRICE_ID: ${{ secrets.PROD_IMPLANT_REGISTRATION_PRICE_ID }}
          PATIENT_VIEW_CHART_PRICE_ID: ${{ secrets.PROD_PATIENT_VIEW_CHART_PRICE_ID }}
          S3_EXPORT_BUCKET_ROOT_PATH: ${{ secrets.PROD_S3_EXPORT_BUCKET_ROOT_PATH }}
          S3_AUDIT_LOG_BACKUP_BUCKET: ${{ secrets.PROD_S3_AUDIT_LOG_BACKUP_BUCKET }}
          
          LAMBDA_SG_ID: $LAMBDA_SG_ID
          SUBNET_IDS:
          $SUBNET_IDS_YAML
          SUBNET_IDS_STRING: "$SUBNET_IDS_STRING"
          EOF

      - name: Destroy Serverless App
        run: |
          export SERVERLESS_LICENSE_KEY=${{ secrets.SERVERLESS_LICENSE_KEY }}
          sls remove --stage $ENVIRONMENT

  destroy-terraform:
    needs: destroy-serverless
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-infra
    env:
      ENVIRONMENT: prod
      AWS_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Select Workspace
        run: terraform workspace select $ENVIRONMENT

      - name: Terraform Destroy
        run: terraform destroy -auto-approve